name: lab01
prefix: ""

topology:
  nodes:
    sw1:
      kind: arista_ceos
      image: ceos:4.32.2F
    sw2:
      kind: arista_ceos
      image: ceos:4.32.2F
    sw3:
      kind: arista_ceos
      image: ceos:4.32.2F
    sw4:
      kind: arista_ceos
      image: ceos:4.32.2F


    pc1:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.10.11/24 dev eth1
    pc2:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.10.12/24 dev eth1
    pc3:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.10.13/24 dev eth1
    pc4:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.10.14/24 dev eth1



  links:
    - endpoints: [ "sw1:eth3", "sw2:eth1" ]
    - endpoints: [ "sw2:eth3", "sw3:eth1" ]
    - endpoints: [ "sw3:eth3", "sw4:eth1" ]
    - endpoints: [ "pc1:eth1", "sw1:eth2" ]
    - endpoints: [ "pc2:eth1", "sw2:eth2" ]
    - endpoints: [ "pc3:eth1", "sw3:eth2" ]
    - endpoints: [ "pc4:eth1", "sw4:eth2" ]
